<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b33"><title>DACATECH | Cotizaciones</title>
<style>
:root{--navy:#071b33;--blue:#1675cf;--sky:#eaf4ff;--ink:#142238;--muted:#718096;--line:#e3eaf1;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1120px;margin:auto;min-height:100vh}.top{background:var(--navy);color:white;padding:20px 22px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:2px;font-size:20px}.brand small{display:block;font-size:9px;letter-spacing:3px;color:#9ecfff;margin-top:3px}.top button{background:#173656;color:white;border:1px solid #31516f}.layout{display:grid;grid-template-columns:215px 1fr;min-height:calc(100vh - 76px)}nav{background:white;border-right:1px solid var(--line);padding:18px 12px}nav button{display:block;width:100%;text-align:left;margin:5px 0;background:white;color:#40516a}nav button.active{background:var(--sky);color:var(--blue)}main{padding:26px;min-width:0}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}h1{font-size:25px;margin:0;color:var(--navy)}.sub{color:var(--muted);margin-top:5px}.btn,button{border:0;border-radius:9px;padding:11px 14px;background:var(--blue);color:white;font-weight:650;cursor:pointer;font-size:14px}.btn.secondary,button.secondary{background:white;border:1px solid var(--line);color:var(--ink)}button.danger{background:#fff0f0;color:#b42318}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.stat,.panel,.product,.client,.quote{background:white;border:1px solid var(--line);border-radius:13px;padding:16px}.stat b{display:block;font-size:25px;color:var(--navy);margin-top:6px}.muted{color:var(--muted);font-size:13px}.panel{margin-top:16px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}label{font-size:13px;font-weight:650;color:#41536b}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d9e2ec;border-radius:8px;font:inherit;background:white;color:var(--ink)}textarea{min-height:75px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.product-list,.list{display:grid;gap:10px;margin-top:14px}.product{display:grid;grid-template-columns:80px 1fr auto;gap:13px;align-items:center}.thumb{width:80px;height:75px;border-radius:9px;object-fit:cover;background:#edf3f9}.product h3{font-size:15px;margin:0 0 5px}.product p{margin:0;color:var(--muted);font-size:13px}.price{font-weight:750;color:var(--navy);margin-top:7px}.pill{display:inline-block;padding:5px 8px;background:var(--sky);color:#1768b5;border-radius:20px;font-size:11px}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap}.quote-preview{background:white;border:1px solid var(--line);padding:25px;border-radius:12px;margin-top:15px}.qhead{display:flex;justify-content:space-between;border-bottom:3px solid var(--navy);padding-bottom:15px}.qbrand{font-weight:850;letter-spacing:2px;color:var(--navy);font-size:21px}.qrow{display:grid;grid-template-columns:64px 1fr 60px 100px 110px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.qrow img{width:60px;height:52px;object-fit:contain;background:#f3f6fa;border-radius:6px}.totals{margin-left:auto;max-width:280px;margin-top:15px}.totals div{display:flex;justify-content:space-between;padding:5px}.totals .grand{border-top:2px solid var(--navy);font-weight:800;font-size:18px;color:var(--navy);padding-top:10px}.template{border:1px solid var(--line);border-radius:10px;padding:13px;background:white;cursor:pointer}.template.selected{border:2px solid var(--blue);background:var(--sky)}@media(max-width:720px){.layout{display:block}nav{display:flex;overflow:auto;gap:6px;padding:8px;border-right:0;border-bottom:1px solid var(--line)}nav button{white-space:nowrap;width:auto;margin:0;padding:9px 12px}main{padding:16px}.grid{grid-template-columns:1fr 1fr}.product{grid-template-columns:64px 1fr}.thumb{width:64px;height:64px}.product .add{grid-column:2}.head{align-items:flex-start}.qrow{grid-template-columns:48px 1fr 42px 75px;font-size:11px}.qrow .line-total{display:none}.qrow img{width:45px;height:42px}.quote-preview{padding:13px}.top{padding:16px}.brand{font-size:18px}}@media print{body{background:white}.top,nav,.head,.no-print{display:none!important}.layout{display:block}main{padding:0}.quote-preview{border:0;margin:0;padding:0}.qrow{break-inside:avoid}}
</style></head><body><div class="app"><header class="top"><div class="brand">DACATECH<small>SEGURIDAD · ENERGÍA · COMUNICACIÓN</small></div><span class="pill" style="background:#173656;color:#cfe7ff">COTIZACIONES</span></header><div class="layout"><nav id="nav"><button class="active" data-page="home">Inicio</button><button data-page="quotes">Cotizaciones</button><button data-page="clients">Clientes</button><button data-page="products">Productos</button><button data-page="templates">Plantillas</button></nav><main id="main"></main></div></div>
<script>
const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0),read=k=>JSON.parse(localStorage.getItem('daca_'+k)||'[]'),save=(k,v)=>localStorage.setItem('daca_'+k,JSON.stringify(v));
let page='home',cart=[],selectedTemplate=0,editingQuote=null;
const svg=(txt)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120"><rect width="100%" height="100%" rx="12" fill="#eaf2fa"/><circle cx="80" cy="48" r="25" fill="#b8cde0"/><text x="80" y="95" font-size="12" text-anchor="middle" fill="#35516d">'+txt+'</text></svg>');
function go(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function seed(){if(!read('products').length)save('products',[{id:1,name:'Cámara IP 2MP exterior',sku:'CCTV-002',price:280000,img:svg('Cámara IP')},{id:2,name:'DVR 8 canales',sku:'DVR-008',price:450000,img:svg('DVR')},{id:3,name:'Fuente 12V 1A',sku:'PWR-12V',price:25000,img:svg('Fuente')},{id:4,name:'Cable UTP Cat 6',sku:'RED-CAT6',price:320000,img:svg('Cable UTP')}]);if(!read('templates').length)save('templates',[{name:'Cotización corporativa',kind:'cotizacion'},{name:'Propuesta económica',kind:'propuesta'}])}
seed();
function render(){let m=$('#main');if(page==='home'){let c=read('clients'),p=read('products'),q=read('quotes');m.innerHTML='<div class="head"><div><h1>Panel principal</h1><div class="sub">Gestiona clientes, productos y cotizaciones.</div></div><button onclick="newQuote()">＋ Nueva cotización</button></div><div class="grid"><div class="stat">Cotizaciones<b>'+q.length+'</b><span class="muted">Registradas</span></div><div class="stat">Clientes<b>'+c.length+'</b><span class="muted">Guardados</span></div><div class="stat">Productos<b>'+p.length+'</b><span class="muted">En catálogo</span></div></div><div class="panel"><h3>Accesos rápidos</h3><div class="actions"><button onclick="go(\'quotes\')">Ver cotizaciones</button><button class="secondary" onclick="go(\'clients\')">Administrar clientes</button><button class="secondary" onclick="go(\'products\')">Catálogo</button><button class="secondary" onclick="go(\'templates\')">Plantillas</button></div></div>'}
if(page==='clients'){m.innerHTML='<div class="head"><div><h1>Clientes</h1><div class="sub">Directorio de clientes</div></div><button onclick="clientForm()">＋ Nuevo cliente</button></div><div id="form"></div><div class="list">'+read('clients').map((c,i)=>'<div class="client"><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.nit||'')+' · '+esc(c.email||'')+' · '+esc(c.phone||'')+'</div><div class="actions" style="margin-top:9px"><button class="secondary" onclick="editClient('+i+')">Editar</button><button class="danger" onclick="delClient('+i+')">Eliminar</button></div></div>').join('')+'</div>'}
if(page==='products'){m.innerHTML='<div class="head"><div><h1>Productos</h1><div class="sub">Catálogo con fotografía para incluir en el PDF</div></div><button onclick="productForm()">＋ Nuevo producto</button></div><div id="form"></div><div class="product-list">'+read('products').map((p,i)=>'<div class="product"><img class="thumb" src="'+p.img+'"><div><h3>'+esc(p.name)+'</h3><p>'+esc(p.sku||'')+'</p><div class="price">'+money(p.price)+'</div></div><div class="actions"><button class="secondary" onclick="editProduct('+i+')">Editar</button><button onclick="addCart('+p.id+')">Agregar</button></div></div>').join('')+'</div>'}
if(page==='templates'){let ts=read('templates');m.innerHTML='<div class="head"><div><h1>Plantillas</h1><div class="sub">Selecciona el formato para tus documentos.</div></div><button onclick="templateForm()">＋ Crear plantilla</button></div><div class="grid">'+ts.map((t,i)=>'<div class="template '+(selectedTemplate===i?'selected':'')+'" onclick="selectedTemplate='+i+';render()"><span class="pill">'+t.kind+'</span><h3>'+esc(t.name)+'</h3><span class="muted">Seleccionar este diseño</span></div>').join('')+'</div><div class="panel"><b>Plantilla activa:</b> '+esc(ts[selectedTemplate]?.name||'Cotización corporativa')+'<p class="muted">Las plantillas personalizadas se guardan en este navegador.</p></div>'}
if(page==='quotes'){let qs=read('quotes');m.innerHTML='<div class="head"><div><h1>Cotizaciones</h1><div class="sub">Historial de documentos creados</div></div><button onclick="newQuote()">＋ Nueva cotización</button></div><div class="list">'+qs.map((q,i)=>'<div class="quote"><div class="row"><div><b>'+esc(q.number)+' · '+esc(q.clientName)+'</b><div class="muted">'+esc(q.title)+' · '+esc(q.date)+'</div></div><b>'+money(q.total)+'</b></div><div class="actions" style="margin-top:10px"><button onclick="viewQuote('+i+')">Ver / PDF</button><button class="secondary" onclick="editQuote('+i+')">Editar</button></div></div>').join('')+'</div>'}
if(page==='newquote')quoteForm()}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clientForm(c={}){$('#form').innerHTML='<div class="panel"><h3>Datos del cliente</h3><div class="field"><label>Nombre o razón social</label><input id="cn" value="'+esc(c.name)+'"></div><div class="row"><div class="field"><label>NIT / Cédula</label><input id="nit" value="'+esc(c.nit)+'"></div><div class="field"><label>Teléfono</label><input id="phone" value="'+esc(c.phone)+'"></div></div><div class="field"><label>Correo</label><input id="email" value="'+esc(c.email)+'"></div><button onclick="saveClient()">Guardar cliente</button></div>'}
function saveClient(){let a=read('clients');a.push({name:$('#cn').value,nit:$('#nit').value,phone:$('#phone').value,email:$('#email').value});save('clients',a);render()}
function editClient(i){let c=read('clients')[i];clientForm(c);$('#form button').onclick=()=>{let a=read('clients');a[i]={name:$('#cn').value,nit:$('#nit').value,phone:$('#phone').value,email:$('#email').value};save('clients',a);render()}}
function delClient(i){let a=read('clients');a.splice(i,1);save('clients',a);render()}
function productForm(p={}){$('#form').innerHTML='<div class="panel"><h3>Producto</h3><div class="field"><label>Nombre</label><input id="pn" value="'+esc(p.name)+'"></div><div class="row"><div class="field"><label>Referencia</label><input id="sku" value="'+esc(p.sku)+'"></div><div class="field"><label>Precio COP</label><input id="price" type="number" value="'+(p.price||'')+'"></div></div><div class="field"><label>Fotografía del producto</label><input id="photo" type="file" accept="image/*"><img id="photoPreview" class="thumb" src="'+(p.img||svg('Vista previa'))+'"></div><button onclick="saveProduct()">Guardar producto</button></div>';$('#photo').onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader();r.onload=()=>$('#photoPreview').src=r.result;r.readAsDataURL(f)}}}
function saveProduct(){let img=$('#photoPreview').src,p={id:Date.now(),name:$('#pn').value,sku:$('#sku').value,price:Number($('#price').value),img};if(!p.name)return alert('Escribe el nombre del producto');let a=read('products');a.push(p);save('products',a);render()}
function editProduct(i){let p=read('products')[i];productForm(p);$('#form button').onclick=()=>{let a=read('products');a[i]={...p,name:$('#pn').value,sku:$('#sku').value,price:Number($('#price').value),img:$('#photoPreview').src};save('products',a);render()}}
function addCart(id){let p=read('products').find(x=>x.id===id);let x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({...p,qty:1});alert('Producto agregado a la cotización')}
function newQuote(){cart=[];editingQuote=null;go('newquote')}
function quoteForm(){let clients=read('clients'),ts=read('templates');$('#main').innerHTML='<div class="head"><div><h1>Nueva cotización</h1><div class="sub">Selecciona cliente, productos y formato.</div></div><button class="secondary" onclick="go(\'quotes\')">Volver</button></div><div class="panel"><div class="field"><label>Cliente</label><select id="client"><option value="">Seleccionar cliente</option>'+clients.map((c,i)=>'<option value="'+i+'">'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label>Nombre / asunto</label><input id="title" placeholder="Ej. Sistema de cámaras CCTV"></div><div class="row"><div class="field"><label>Fecha</label><input id="date" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Plantilla</label><select id="template">'+ts.map((t,i)=>'<option value="'+i+'">'+esc(t.name)+'</option>').join('')+'</select></div></div><div class="field"><label>Notas / condiciones</label><textarea id="notes" placeholder="Vigencia, forma de pago, garantía..."></textarea></div></div><div class="panel"><div class="head"><h3>Productos</h3><button onclick="productPicker()">＋ Agregar producto</button></div><div id="picker"></div><div id="cartrows"></div><div class="totals" id="totals"></div></div><div class="actions" style="margin-top:16px"><button onclick="saveQuote()">Guardar cotización</button><button class="secondary" onclick="previewQuote()">Vista previa</button></div>';drawCart()}
function productPicker(){let p=read('products');$('#picker').innerHTML='<div class="list">'+p.map(x=>'<div class="row"><span>'+esc(x.name)+' · '+money(x.price)+'</span><button onclick="addCart('+x.id+');drawCart()">Agregar</button></div>').join('')+'</div>'}
function drawCart(){$('#cartrows').innerHTML=cart.map((p,i)=>'<div class="product"><img class="thumb" src="'+p.img+'"><div><b>'+esc(p.name)+'</b><div class="muted">'+money(p.price)+' c/u</div><input style="max-width:90px;margin-top:6px" type="number" min="1" value="'+p.qty+'" onchange="cart['+i+'].qty=Math.max(1,+this.value);drawCart()"></div><button class="danger" onclick="cart.splice('+i+',1);drawCart()">Quitar</button></div>').join('');let sub=cart.reduce((s,p)=>s+p.price*p.qty,0),iva=sub*.19;$('#totals').innerHTML='<div><span>Subtotal</span><b>'+money(sub)+'</b></div><div><span>IVA 19%</span><b>'+money(iva)+'</b></div><div class="grand"><span>Total</span><b>'+money(sub+iva)+'</b></div>'}
function collect(){let ci=$('#client').value;if(ci==='')return alert('Selecciona un cliente');if(!cart.length)return alert('Agrega al menos un producto');let c=read('clients')[+ci],sub=cart.reduce((s,p)=>s+p.price*p.qty,0);return {number:editingQuote?.number||'COT-'+String(Date.now()).slice(-6),clientName:c.name,client:c,title:$('#title').value||'Cotización',date:$('#date').value,notes:$('#notes').value,template:+$('#template').value,items:cart.map(x=>({...x})),subtotal:sub,iva:sub*.19,total:sub*1.19}}
function saveQuote(){let q=collect();if(!q)return;let a=read('quotes');if(editingQuote){let i=a.findIndex(x=>x.number===editingQuote.number);if(i>=0)a[i]=q}else a.unshift(q);save('quotes',a);alert('Cotización guardada');go('quotes')}
function quoteHTML(q){return '<div class="qhead"><div><div class="qbrand">DACATECH</div><div class="muted">Seguridad · Energía · Comunicación<br>NIT 902012348-1 · dacatech@dacatechsas.com</div></div><div style="text-align:right"><h2 style="margin:0">COTIZACIÓN</h2><b>'+esc(q.number)+'</b><div>'+esc(q.date)+'</div></div></div><p><b>CLIENTE:</b> '+esc(q.clientName)+'<br><span class="muted">'+esc(q.client?.nit||'')+' · '+esc(q.client?.email||'')+' · '+esc(q.client?.phone||'')+'</span></p><h3>'+esc(q.title)+'</h3><div class="qrow" style="font-weight:800;background:#edf4fb"><span>Imagen</span><span>Producto / descripción</span><span>Cant.</span><span>Precio</span><span class="line-total">Importe</span></div>'+q.items.map(p=>'<div class="qrow"><img src="'+p.img+'"><span>'+esc(p.name)+'<br><small>'+esc(p.sku||'')+'</small></span><span>'+p.qty+'</span><span>'+money(p.price)+'</span><span class="line-total">'+money(p.price*p.qty)+'</span></div>').join('')+'<div class="totals"><div><span>Subtotal</span><b>'+money(q.subtotal)+'</b></div><div><span>IVA (19%)</span><b>'+money(q.iva)+'</b></div><div class="grand"><span>TOTAL</span><b>'+money(q.total)+'</b></div></div><p style="margin-top:30px"><b>CONDICIONES Y OBSERVACIONES</b><br>'+esc(q.notes||'Vigencia y condiciones sujetas a confirmación comercial.')+'</p><p class="muted" style="margin-top:35px">DACATECH SAS · Gracias por confiar en nosotros.</p>'}
function previewQuote(){let q=collect();if(!q)return;$('#main').innerHTML='<div class="head no-print"><h1>Vista previa de cotización</h1><div class="actions"><button onclick="window.print()">Descargar / Imprimir PDF</button><button class="secondary" onclick="quoteForm()">Volver a editar</button></div></div><div class="quote-preview">'+quoteHTML(q)+'</div>'}
function viewQuote(i){let q=read('quotes')[i];$('#main').innerHTML='<div class="head no-print"><h1>'+esc(q.number)+'</h1><div class="actions"><button onclick="window.print()">Generar PDF</button><button class="secondary" onclick="go(\'quotes\')">Volver</button></div></div><div class="quote-preview">'+quoteHTML(q)+'</div>'}
function editQuote(i){let q=read('quotes')[i];editingQuote=q;cart=q.items.map(x=>({...x}));go('newquote');setTimeout(()=>{let c=read('clients').findIndex(x=>x.name===q.clientName);$('#client').value=c;$('#title').value=q.title;$('#date').value=q.date;$('#notes').value=q.notes;$('#template').value=q.template;drawCart()},0)}
function templateForm(){let n=prompt('Nombre de la plantilla:');if(n){let a=read('templates');a.push({name:n,kind:'personalizada'});save('templates',a);selectedTemplate=a.length-1;render()}}
render();
</script></body></html>
